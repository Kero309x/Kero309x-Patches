# Publishes a release from main when the version in gradle.properties is new.
# v0.1.0 was published manually; this workflow is the path for later releases.

name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties | head -n 1)"
          if [ -z "$version" ]; then
            echo "No version found in gradle.properties" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Check for an existing tag
        id: tag
        run: |
          if git rev-parse --quiet --verify "refs/tags/v${{ steps.version.outputs.value }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require the framework registry token
        if: steps.tag.outputs.exists == 'false'
        env:
          REGISTRY_TOKEN: ${{ secrets.MORPHE_REGISTRY_TOKEN }}
        run: |
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "::error::MORPHE_REGISTRY_TOKEN is empty. Add a classic personal access token with the read:packages scope as both a repository secret and a Dependabot secret; see docs/development/setup.md."
            exit 1
          fi

      - name: Set up JDK
        if: steps.tag.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: steps.tag.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        if: steps.tag.outputs.exists == 'false'
        run: ./gradlew build --no-daemon --stacktrace
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_REGISTRY_TOKEN }}
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}

      - name: Publish
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.value }}"
          bundle="$(find patches/build/libs -maxdepth 1 -type f -name 'patches-*.mpp' \
            ! -name '*-sources.mpp' ! -name '*-javadoc.mpp' | head -n 1)"
          if [ -z "$bundle" ]; then
            echo "No bundle produced" >&2
            exit 1
          fi
          asset="Kero309x-Patches-${version}.mpp"
          cp "$bundle" "$asset"
          prerelease=()
          if [[ "$version" == 0.* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "v$version" \
            --title "Kero309x Patches $version" \
            --generate-notes \
            "${prerelease[@]}" \
            "$asset"
